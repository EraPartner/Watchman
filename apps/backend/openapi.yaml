openapi: 3.1.0
info:
  title: Watchman Backend API
  description: |
    Self-hosted service monitoring dashboard backend (TypeScript + Fastify 4).
    All endpoints return JSON. Envelope: `{ data: ... }` on success,
    `{ error: { code, message } }` on failure. Polling is server-owned;
    HTTP reads serve cached/poller-published state.
  version: 2.0.0
  license:
    name: AGPL-3.0-only
servers:
  - url: http://localhost:3001
    description: Default local development
tags:
  - name: meta
  - name: services
  - name: instances
  - name: metrics
paths:
  /meta/health:
    get:
      tags: [meta]
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, uptime, timestamp]
                properties:
                  ok: { type: boolean }
                  service: { type: string, example: watchman-backend-v2 }
                  uptime: { type: number, description: Seconds since process start }
                  timestamp: { type: string, format: date-time }
  /meta/version:
    get:
      tags: [meta]
      summary: Version info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, node]
                properties:
                  version: { type: string }
                  node: { type: string, example: v20.10.0 }
  /services:
    get:
      tags: [services]
      summary: Aggregated health for all registered services
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AggregatedEntry' }
  /services/{kind}/health:
    get:
      tags: [services]
      summary: Health snapshot for a specific service instance
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Instance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HealthSnapshot' }
        '404': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/DomainError' }
  /services/{kind}/stats:
    get:
      tags: [services]
      summary: Stats snapshot for a specific service instance
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Instance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StatsSnapshot' }
        '404': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/DomainError' }
  /services/{kind}/control:
    post:
      tags: [services]
      summary: Issue a control action to a service instance
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Instance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  example: restart
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean }
        '400': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/DomainError' }
  /instances:
    get:
      tags: [instances]
      summary: All registered service instances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InstanceInfo' }
  /instances/{kind}:
    get:
      tags: [instances]
      summary: Instances for a given service kind
      parameters:
        - $ref: '#/components/parameters/Kind'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InstanceInfo' }
  /kinds:
    get:
      tags: [instances]
      summary: All registered service kinds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: string }
  /metrics:
    get:
      tags: [metrics]
      summary: Operational metrics snapshot (breakers, poller, cache, process)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSnapshot' }
components:
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema: { type: string }
      description: Service kind (e.g. bitcoin, ipfs, homebridge)
    Instance:
      name: instance
      in: query
      required: false
      schema: { type: string }
      description: Instance id. Omit to use first registered instance for the kind.
  responses:
    DomainError:
      description: Domain error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }
  schemas:
    DomainError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
                - UNAVAILABLE
                - UNAUTHORIZED
                - TIMEOUT
                - CIRCUIT_OPEN
                - VALIDATION
            message: { type: string }
    HealthSnapshot:
      type: object
      required: [reachable, at]
      properties:
        reachable: { type: boolean }
        latencyMs: { type: number }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        at: { type: number, description: Timestamp (ms) when snapshot was taken }
    StatsSnapshot:
      type: object
      required: [metrics, at]
      properties:
        metrics:
          type: object
          additionalProperties:
            oneOf:
              - { type: number }
              - { type: string }
              - { type: boolean }
              - { type: 'null' }
        at: { type: number }
    AggregatedEntry:
      type: object
      required: [id, kind, instanceId, result]
      properties:
        id: { type: string, example: 'bitcoin:main' }
        kind: { type: string }
        instanceId: { type: string }
        result:
          oneOf:
            - type: object
              required: [ok, value]
              properties:
                ok: { const: true }
                value: { $ref: '#/components/schemas/HealthSnapshot' }
            - type: object
              required: [ok, error]
              properties:
                ok: { const: false }
                error:
                  type: object
                  required: [code, message]
                  properties:
                    code: { type: string }
                    message: { type: string }
    InstanceInfo:
      type: object
      required: [id, kind, instanceId]
      properties:
        id: { type: string }
        kind: { type: string }
        instanceId: { type: string }
    BreakerMetrics:
      type: object
      required: [state, successes, failures, rejects, trips]
      properties:
        state:
          type: string
          enum: [closed, open, half_open]
        successes: { type: integer }
        failures: { type: integer }
        rejects: { type: integer }
        trips: { type: integer }
    CacheStats:
      type: object
      required: [size, hits, misses]
      properties:
        size: { type: integer }
        hits: { type: integer }
        misses: { type: integer }
    PollerStats:
      type: object
      required: [tracked]
      properties:
        tracked: { type: integer }
    MetricsSnapshot:
      type: object
      required: [breakers, poller, cache, process]
      properties:
        breakers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/BreakerMetrics' }
        poller:
          oneOf:
            - { $ref: '#/components/schemas/PollerStats' }
            - { type: 'null' }
        cache:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CacheStats' }
        process:
          type: object
          required: [uptimeSec, rss, heapUsed]
          properties:
            uptimeSec: { type: integer }
            rss: { type: integer }
            heapUsed: { type: integer }
