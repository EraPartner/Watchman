          $ref: "#/components/responses/ServiceUnavailableError"

  /api/bitcoin/stats:
    get:
      tags:
        - Bitcoin
      summary: Get Bitcoin node statistics
      description: Returns Bitcoin node statistics
      operationId: getBitcoinStats
      security: [ ]
      responses:
        "200":
          description: Bitcoin node statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/qbittorrent/status:
    get:
      tags:
        - qBittorrent
      summary: Get qBittorrent status
      description: Returns the current status of qBittorrent
      operationId: getQBittorrentStatus
      security: [ ]
      responses:
        "200":
          description: qBittorrent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/qbittorrent/stats:
    get:
      tags:
        - qBittorrent
      summary: Get qBittorrent statistics
      description: Returns qBittorrent statistics
      operationId: getQBittorrentStats
      security: [ ]
      responses:
        "200":
          description: qBittorrent statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/ipfs/status:
    get:
      tags:
        - IPFS
      summary: Get IPFS node status
      description: Returns the current status of the IPFS node
      operationId: getIpfsStatus
      security: [ ]
      responses:
        "200":
          description: IPFS node status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/ipfs/stats:
    get:
      tags:
        - IPFS
      summary: Get IPFS node statistics
      description: Returns IPFS node statistics
      operationId: getIpfsStats
      security: [ ]
      responses:
        "200":
          description: IPFS node statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/roon/status:
    get:
      tags:
        - Roon
      summary: Get Roon server status
      description: Returns the current status of the Roon music server
      operationId: getRoonStatus
      security: [ ]
      responses:
        "200":
          description: Roon server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/roon/stats:
    get:
      tags:
        - Roon
      summary: Get Roon server statistics
      description: Returns Roon server statistics
      operationId: getRoonStats
      security: [ ]
      responses:
        "200":
          description: Roon server statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/tor/relay/{nickname}:
    get:
      tags:
        - Tor
      summary: Get Tor relay information
      description: Returns information about a Tor relay
      operationId: getTorRelay
      parameters:
        - name: nickname
          in: path
          required: false
          schema:
            type: string
          description: Tor relay nickname
      responses:
        "200":
          description: Tor relay information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/tor/health:
    get:
      tags:
        - Tor
      summary: Get Tor service health
      description: Returns the health status of the Tor service
      operationId: getTorHealth
      security: [ ]
      responses:
        "200":
          description: Tor service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/synology/status:
    get:
      tags:
        - Synology
      summary: Get Synology NAS status
      description: Returns the current status of the Synology NAS
      operationId: getSynologyStatus
      security: [ ]
      responses:
        "200":
          description: Synology NAS status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/synology/stats:
    get:
      tags:
        - Synology
      summary: Get Synology NAS statistics
      description: Returns Synology NAS statistics
      operationId: getSynologyStats
      security: [ ]
      responses:
        "200":
          description: Synology NAS statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/philips/status:
    get:
      tags:
        - Philips
      summary: Get Philips Bridge status
      description: Returns the current status of the Philips Hue Bridge
      operationId: getPhilipsStatus
      security: [ ]
      responses:
        "200":
          description: Philips Bridge status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/philips/stats:
    get:
      tags:
        - Philips
      summary: Get Philips Bridge statistics
      description: Returns Philips Hue Bridge statistics
      operationId: getPhilipsStats
      security: [ ]
      responses:
        "200":
          description: Philips Bridge statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/homebridge/status:
    get:
      tags:
        - Homebridge
      summary: Get Homebridge status
      description: Returns the current status of Homebridge
      operationId: getHomebridgeStatus
      security: [ ]
      responses:
        "200":
          description: Homebridge status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/homebridge/stats:
    get:
      tags:
        - Homebridge
      summary: Get Homebridge statistics
      description: Returns Homebridge statistics
      operationId: getHomebridgeStats
      security: [ ]
      responses:
        "200":
          description: Homebridge statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/status/homebridge-version:
    get:
      tags:
        - Homebridge
      summary: Get Homebridge version
      description: Returns the version of Homebridge
      operationId: getHomebridgeVersion
      responses:
        "200":
          description: Homebridge version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/status/server-information:
    get:
      tags:
        - Homebridge
      summary: Get Homebridge server information
      description: Returns detailed Homebridge server information
      operationId: getServerInformation
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/accessories:
    get:
      tags:
        - Homebridge
      summary: Get Homebridge accessories
      description: Returns list of Homebridge accessories
      operationId: getAccessories
      responses:
        "200":
          description: List of accessories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/albyhub/status:
    get:
      tags:
        - Alby Hub
      summary: Get Alby Hub status
      description: Returns the current status of Alby Hub
      operationId: getAlbyHubStatus
      security: [ ]
      responses:
        "200":
          description: Alby Hub status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/albyhub/stats:
    get:
      tags:
        - Alby Hub
      summary: Get Alby Hub statistics
      description: Returns Alby Hub statistics
      operationId: getAlbyHubStats
      security: [ ]
      responses:
        "200":
          description: Alby Hub statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/macmini/status:
    get:
      tags:
        - Mac Mini
      summary: Get Mac Mini status
      description: Returns the current status of the Mac Mini server
      operationId: getMacMiniStatus
      security: [ ]
      responses:
        "200":
          description: Mac Mini status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/macmini/stats:
    get:
      tags:
        - Mac Mini
      summary: Get Mac Mini statistics
      description: Returns Mac Mini statistics
      operationId: getMacMiniStats
      security: [ ]
      responses:
        "200":
          description: Mac Mini statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/services/health:
    get:
      tags:
        - Services
      summary: Get all services health
      description: Returns health status of all configured services
      operationId: getAllServicesHealth
      security: [ ]
      responses:
        "200":
          description: All services health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllServicesHealth"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/router/arp:
    get:
      tags:
        - Router
      summary: Get ARP table
      description: Returns the ARP/neighbor table for a router service
      operationId: getRouterArp
      security: [ ]
      parameters:
        - name: service
          in: query
          required: true
          schema:
            type: string
          description: Service name (e.g., 'beryl', 'telenet')
      responses:
        "200":
          description: ARP table data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterArpResponse"
        "400":
          description: Missing or invalid service parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/security/alerts:
    get:
      tags:
        - Security
      summary: Get security alerts
      description: Returns security alerts (requires authentication and whitelisted IP)
      operationId: getSecurityAlerts
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [ low, medium, high, critical ]
        - name: type
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Security alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityAlertsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/security/stats:
    get:
      tags:
        - Security
      summary: Get security statistics
      description: Returns security statistics (requires authentication and whitelisted IP)
      operationId: getSecurityStats
      responses:
        "200":
          description: Security statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityStatsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
