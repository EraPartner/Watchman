openapi: 3.1.0
info:
  title: Watchman Backend API
  description: |
    Self-hosted service monitoring dashboard backend (TypeScript + Fastify 4).
    **Single-user design**: No authentication required. Intended for trusted networks only.
    All endpoints return JSON. Envelope: `{ data: ... }` on success,
    `{ error: { code, message } }` on failure. Polling is server-owned;
    HTTP reads serve cached/poller-published state.

    **CORS**: Requests from `watchman://` origin (Electron desktop app) receive permissive CORS headers.
    Web deployments use standard CORS policies configured via `FRONTEND_URL` env var.
  version: 2.1.0
  license:
    name: AGPL-3.0-only
servers:
  - url: http://localhost:3001
    description: Default local development
tags:
  - name: meta
  - name: services
  - name: instances
  - name: metrics
  - name: config
  - name: setup
paths:
  /meta/health:
    get:
      tags: [meta]
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, uptime, timestamp]
                properties:
                  ok: { type: boolean }
                  service: { type: string, example: watchman-backend-v2 }
                  uptime: { type: number, description: Seconds since process start }
                  timestamp: { type: string, format: date-time }
  /meta/version:
    get:
      tags: [meta]
      summary: Version info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, node]
                properties:
                  version: { type: string }
                  node: { type: string, example: v20.10.0 }
  /services:
    get:
      tags: [services]
      summary: Aggregated health for all registered services
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AggregatedEntry' }
  /services/{kind}/health:
    get:
      tags: [services]
      summary: Health snapshot for a specific service instance
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Instance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/HealthSnapshot' }
        '404': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/DomainError' }
  /services/{kind}/stats:
    get:
      tags: [services]
      summary: Stats snapshot for a specific service instance
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Instance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StatsSnapshot' }
        '404': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/DomainError' }
  /services/{kind}/control:
    post:
      tags: [services]
      summary: Issue a control action to a service instance
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Instance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  example: restart
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean }
        '400': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/DomainError' }
  /instances:
    get:
      tags: [instances]
      summary: All registered service instances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InstanceInfo' }
  /instances/{kind}:
    get:
      tags: [instances]
      summary: Instances for a given service kind
      parameters:
        - $ref: '#/components/parameters/Kind'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InstanceInfo' }
  /kinds:
    get:
      tags: [instances]
      summary: All registered service kinds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: string }
  /metrics:
    get:
      tags: [metrics]
      summary: Operational metrics snapshot (breakers, poller, cache, process)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSnapshot' }
  /setup/status:
    get:
      tags: [setup]
      summary: Setup mode status (needs wizard?)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SetupStatus' }
  /setup/philips-bridge/pair:
    post:
      tags: [setup]
      summary: Pair with a Philips Hue Bridge (press-link wizard)
      description: |
        Press the physical link button on the bridge, then call this endpoint.
        Simultaneously probes the TLS certificate SHA-256 fingerprint and posts to the
        bridge `/api` endpoint to obtain an application key.
        Returns `applicationKey` and `certHash` for use in the service configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host:
                  type: string
                  description: IP or hostname of the Hue bridge
                timeoutMs:
                  type: integer
                  default: 10000
                  description: Request timeout in milliseconds
      responses:
        '200':
          description: Pairing successful
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [applicationKey, certHash]
                    properties:
                      applicationKey:
                        type: string
                        description: Hue API v2 application key (username)
                      certHash:
                        type: string
                        description: SHA-256 fingerprint of the bridge TLS certificate (hex)
        '400':
          description: Missing host or link button not pressed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Bridge unreachable or connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /config/kinds:
    get:
      tags: [config]
      summary: Registered service kinds with Zod-derived field metadata for form rendering
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KindSchema' }
  /config/services:
    get:
      tags: [config]
      summary: All configured service instances (secrets redacted)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceInstance' }
    post:
      tags: [config]
      summary: Create a service instance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInstanceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceInstance' }
        '400': { $ref: '#/components/responses/DomainError' }
        '409': { $ref: '#/components/responses/DomainError' }
  /config/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [config]
      summary: Single service instance (secrets redacted)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceInstance' }
        '404': { $ref: '#/components/responses/DomainError' }
    put:
      tags: [config]
      summary: |
        Update service instance. Secret fields sent as "***" preserve existing value.
        The `instanceId` may be changed; renames are validated against
        `^[a-z0-9][a-z0-9-]*$` (max 64 chars), checked for uniqueness within the
        same kind, recorded as a dedicated `rename` audit row, and broadcast as
        a `config:service.renamed` event. Returns 400 on a conflicting or
        malformed instanceId.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInstanceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceInstance' }
        '400': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/DomainError' }
    delete:
      tags: [config]
      summary: Delete a service instance
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/DomainError' }
  /config/services/{id}/test:
    post:
      tags: [config]
      summary: Run test-connection probe against a live service instance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TestConnectionResult' }
        '404': { $ref: '#/components/responses/DomainError' }
        '409': { $ref: '#/components/responses/DomainError' }
  /config/audit:
    get:
      tags: [config]
      summary: Config audit timeline (most recent first)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
  /config/export:
    get:
      tags: [config]
      summary: Export all service configurations as encrypted bundle
      responses:
        '200':
          description: Encrypted bundle (payload is base64 AES-256-GCM of plaintext services)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportBundle' }
  /config/import:
    post:
      tags: [config]
      summary: Import a previously exported bundle; upserts by (kind, instanceId)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportBundle' }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ImportResult' }
        '400':
          description: Invalid bundle
components:
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema: { type: string }
      description: Service kind (e.g. bitcoin, ipfs, homebridge)
    Instance:
      name: instance
      in: query
      required: false
      schema: { type: string }
      description: Instance id. Omit to use first registered instance for the kind.
  responses:
    DomainError:
      description: Domain error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }
  schemas:
    DomainError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
                - UNAVAILABLE
                - UNAUTHORIZED
                - TIMEOUT
                - CIRCUIT_OPEN
                - VALIDATION
            message: { type: string }
    HostHealth:
      type: object
      required: [reachable]
      properties:
        reachable: { type: boolean, description: ICMP ping succeeded }
        pingMs: { type: number, description: Round-trip time in milliseconds }
    ServiceHealth:
      type: object
      required: [reachable]
      properties:
        reachable: { type: boolean, description: Service protocol probe succeeded }
        latencyMs: { type: number, description: Protocol probe latency in milliseconds }
        message: { type: string, description: Human-readable failure reason }
        details:
          type: object
          additionalProperties: true
          description: Service-specific diagnostic details
    HealthSnapshot:
      type: object
      required: [reachable, at]
      properties:
        reachable: { type: boolean, description: 'Composite: host AND service reachable' }
        latencyMs: { type: number, description: 'Service latency, falls back to ping latency' }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        at: { type: number, description: Timestamp (ms) when snapshot was taken }
        host:
          $ref: '#/components/schemas/HostHealth'
          description: ICMP reachability tier
        service:
          $ref: '#/components/schemas/ServiceHealth'
          description: Protocol probe tier
    StatsSnapshot:
      type: object
      required: [metrics, at]
      properties:
        metrics:
          type: object
          description: |
            Service-specific metrics. Keys and types vary by service kind.
            See service integration docs for metric details:
            - **Bitcoin** (BT1, BT2): blocks, difficulty, connections, mempool metrics (BT1); zmqLastBlockHash, zmqLastBlockAt, zmqBlockCount when zmqHashblockEndpoint configured (BT2 — real-time ZMQ)
            - **Raspberry Pi** (PI1): cpuTemp (°C), clockRate (MHz), voltage (V), throttled (0=healthy, non-zero=throttling/undervoltage), load (avg), memory (string), uptime (s), prettyName (string), processor (string), isRpi (bool), pigpioVersion (number). The `throttled` field comes from vcgencmd get_throttled.
            - **IPFS** (IP1): system diagnostics, DHT routing, pins, listen addresses
            - **Roon** (RN1/RN2): host, portCount, pingEnabled, configured; when useRoonApi=true: paired (bool), zoneCount (number), activeZones (number), nowPlaying (string, optional)
            - **Alby Hub**: NWC fields when legacyProbe=false (connected, setupCompleted, backendType, appCount)
            - **qBittorrent** (QB1): per-torrent stats, speeds, progress, ETA
            - **AdGuard Home** (AG1): filtering, clients, DHCP, security features
            - **Philips Hue** (X3): lightCount, onCount, offCount with time-series charting
          additionalProperties:
            oneOf:
              - { type: number }
              - { type: string }
              - { type: boolean }
              - { type: 'null' }
        at:
          type: number
          description: Timestamp (milliseconds since epoch) when snapshot was taken
    AggregatedEntry:
      type: object
      required: [id, kind, instanceId, result]
      properties:
        id: { type: string, example: 'bitcoin:main' }
        kind: { type: string }
        instanceId: { type: string }
        result:
          oneOf:
            - type: object
              required: [ok, value]
              properties:
                ok: { const: true }
                value: { $ref: '#/components/schemas/HealthSnapshot' }
            - type: object
              required: [ok, error]
              properties:
                ok: { const: false }
                error:
                  type: object
                  required: [code, message]
                  properties:
                    code: { type: string }
                    message: { type: string }
    InstanceInfo:
      type: object
      required: [id, kind, instanceId]
      properties:
        id: { type: string }
        kind: { type: string }
        instanceId: { type: string }
    BreakerMetrics:
      type: object
      required: [state, successes, failures, rejects, trips]
      properties:
        state:
          type: string
          enum: [closed, open, half_open]
        successes: { type: integer }
        failures: { type: integer }
        rejects: { type: integer }
        trips: { type: integer }
    CacheStats:
      type: object
      required: [size, hits, misses]
      properties:
        size: { type: integer }
        hits: { type: integer }
        misses: { type: integer }
    PollerStats:
      type: object
      required: [tracked]
      properties:
        tracked: { type: integer }
    MetricsSnapshot:
      type: object
      required: [breakers, poller, cache, process]
      properties:
        breakers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/BreakerMetrics' }
        poller:
          oneOf:
            - { $ref: '#/components/schemas/PollerStats' }
            - { type: 'null' }
        cache:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CacheStats' }
        process:
          type: object
          required: [uptimeSec, rss, heapUsed]
          properties:
            uptimeSec: { type: integer }
            rss: { type: integer }
            heapUsed: { type: integer }
    SetupStatus:
      type: object
      required: [needsSetup, serviceCount]
      properties:
        needsSetup: { type: boolean }
        serviceCount: { type: integer }
    FieldMeta:
      type: object
      required: [name, label, type]
      properties:
        name: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [string, number, boolean, secret, url, enum]
        required: { type: boolean }
        secret: { type: boolean }
        placeholder: { type: string }
        help: { type: string }
        options:
          type: array
          items: { type: string }
    KindSchema:
      type: object
      required: [kind, label, fields]
      properties:
        kind: { type: string }
        label: { type: string }
        description: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldMeta' }
    ServiceInstance:
      type: object
      required: [id, kind, instanceId, enabled, config, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        instanceId: { type: string }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
          description: Full service config. Secret field values returned as "***".
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceInstanceInput:
      type: object
      required: [kind, instanceId, enabled]
      additionalProperties: true
      description: Full service-instance config (kind-discriminated). Secrets sent as "***" preserve existing value on update. Request is flat (not nested under "config"); kind determines which additional fields are present.
      properties:
        kind: { type: string, example: bitcoin }
        instanceId: { type: string, example: main }
        enabled: { type: boolean, example: true }
        pollPolicy:
          type: object
          additionalProperties: true
          description: Per-kind polling behavior (optional)
        cacheTtlMs: { type: integer, example: 10000, description: Cache TTL in milliseconds (optional; default 10000) }
        timeoutMs: { type: integer, example: 5000, description: Request timeout in milliseconds (optional; default 5000) }
      example:
        kind: bitcoin
        instanceId: main
        enabled: true
        cacheTtlMs: 10000
        timeoutMs: 5000
        onionUrl: "http://example.onion"
        rpcUser: "bitcoinrpc"
        rpcPassword: "secret123"
        rpcPort: 8332
    TestConnectionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        latencyMs: { type: number }
        error: { type: string }
    AuditEntry:
      type: object
      required: [id, ts, action, targetKind, targetId]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        action:
          type: string
          enum: [create, update, delete, import, export]
        targetKind: { type: string }
        targetId: { type: string }
        actor: { type: string }
        diff:
          type: object
          additionalProperties: true
    ExportBundle:
      type: object
      required: [version, exportedAt, payload]
      properties:
        version: { type: integer, enum: [1] }
        exportedAt: { type: string, format: date-time }
        payload:
          type: string
          description: Base64 AES-256-GCM ciphertext of JSON service array
    ImportResult:
      type: object
      required: [imported, updated, skipped, errors]
      properties:
        imported: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [kind, instanceId, message]
            properties:
              kind: { type: string }
              instanceId: { type: string }
              message: { type: string }
    QBittorrentTorrentInfo:
      type: object
      description: Per-torrent detail from qBittorrent /api/v2/torrents/info
      properties:
        hash: { type: string, description: Torrent hash }
        name: { type: string, description: Torrent name }
        state: { type: string, description: Torrent state (downloading, uploading, pausedDL, pausedUP, error, etc.) }
        progress: { type: number, description: Progress 0..1 }
        dlspeed: { type: number, description: Download speed in bytes/sec }
        upspeed: { type: number, description: Upload speed in bytes/sec }
        size: { type: number, description: Total size in bytes }
        downloaded: { type: number, description: Downloaded bytes }
        uploaded: { type: number, description: Uploaded bytes }
        eta: { type: number, description: ETA seconds }
        category: { type: string, description: Torrent category }
    QBittorrentStats:
      type: object
      description: qBittorrent service metrics (QB1 — incremental sync + per-torrent details + logs)
      required: [torrentsTotal, torrentsDownloading, torrentsSeeding, torrentsPaused, torrentsCompleted, torrentsError, dlSpeed, upSpeed, activeTorrents, recentErrors, recentWarnings]
      properties:
        version: { type: string, description: qBittorrent API version }
        uptime: { type: number, description: Uptime in seconds }
        torrentsTotal: { type: integer, description: Total torrent count }
        torrentsDownloading: { type: integer, description: Torrents in downloading state }
        torrentsSeeding: { type: integer, description: Torrents in uploading state }
        torrentsPaused: { type: integer, description: Paused torrents }
        torrentsCompleted: { type: integer, description: Completed torrents }
        torrentsError: { type: integer, description: Torrents in error or missingFiles state }
        dlSpeed: { type: number, description: Global download speed in bytes/sec }
        upSpeed: { type: number, description: Global upload speed in bytes/sec }
        dlData: { type: number, description: Total downloaded in bytes }
        upData: { type: number, description: Total uploaded in bytes }
        connectionStatus: { type: string, description: Connection status (connected, disconnected, firewalled) }
        listenPort: { type: integer, description: Listen port }
        dhtNodes: { type: integer, description: DHT node count }
        freeSpaceOnDisk: { type: number, description: Free disk space in bytes }
        activeTorrents:
          type: array
          maxItems: 20
          description: Top 20 torrents by combined dl+ul speed (per-torrent sync)
          items: { $ref: '#/components/schemas/QBittorrentTorrentInfo' }
        recentErrors:
          type: array
          description: Critical log messages from /api/v2/log/main (type=8) since last poll
          items: { type: string }
        recentWarnings:
          type: array
          description: Warning log messages from /api/v2/log/main (type=4) since last poll
          items: { type: string }
    AdGuardStats:
      type: object
      description: AdGuard Home service metrics (AG1 — extended stats with filtering, clients, DHCP, security features; graceful degradation on optional endpoint failures)
      properties:
        version: { type: string, description: AdGuard Home version }
        running: { type: boolean, description: Service running state }
        protectionEnabled: { type: boolean, description: DNS protection enabled flag }
        dnsPort: { type: integer, description: DNS server port }
        httpPort: { type: integer, description: HTTP API port }
        totalQueries: { type: integer, description: Total DNS queries processed }
        blockedQueries: { type: integer, description: Sum of all blocked queries (filtering + safebrowsing + safesearch + parental) }
        allowedQueries: { type: integer, description: Allowed queries = totalQueries - blockedQueries }
        blockingRate: { type: number, description: Percentage of blocked queries (0–100, rounded to 2 decimals) }
        avgProcessingTime: { type: number, description: Average DNS query processing time (milliseconds) }
        topBlockedDomain: { type: string, description: Most-blocked domain name (or 'N/A') }
        topQueriedDomain: { type: string, description: Most-queried domain name (or 'N/A') }
        topClient: { type: string, description: Most-active client IP (or 'N/A') }
        safebrowsingBlocked: { type: integer, description: Queries blocked by SafeBrowsing filter }
        safesearchBlocked: { type: integer, description: Queries blocked by SafeSearch enforcement }
        parentalBlocked: { type: integer, description: Queries blocked by Parental Control filter }
