appId: io.watchman.desktop
productName: Watchman
directories:
  output: out
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../frontend/dist
    to: frontend/dist
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Utility
