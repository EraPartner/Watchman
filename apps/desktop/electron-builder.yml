appId: io.watchman.desktop
productName: Watchman
directories:
  output: out
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../backend/dist
    to: backend/dist
  - from: ../backend/node_modules
    to: backend/node_modules
  - from: ../backend/package.json
    to: backend/package.json
  - from: ../backend/.env.example
    to: backend/.env.example
  - from: ../frontend/dist
    to: frontend/dist
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Utility
