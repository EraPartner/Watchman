name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Secrets scan — gitleaks on push/PR diff range
  # ─────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Deps audit — npm audit fails on HIGH or CRITICAL vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  deps-audit:
    name: Deps Audit (JS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit JS dependencies
        # Allowed advisories documented in .audit-ci.json
        run: npx audit-ci --config .audit-ci.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — frontend ESLint + backend ESLint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Lint backend
        run: npm run lint:backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Type-check — TypeScript strict check on frontend + desktop
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck --workspace=apps/frontend

      - name: Type-check desktop (Electron shell)
        working-directory: apps/desktop
        run: npx tsc --noEmit -p tsconfig.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Type-check backend — tsc strict check over the TypeScript backend.
  # Required gate: catches type regressions in the backend before reaching main.
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck-backend:
    name: Type Check (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check backend
        run: npm run typecheck --workspace=apps/backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify generated artifacts — the committed OpenAPI-derived TS types must
  # match apps/backend/openapi.yaml. Drift means someone edited openapi.yaml
  # without running `npm run generate:types`. Cheap, high-signal — and CLAUDE.md
  # explicitly flags this sync risk.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-generated:
    name: Verify Generated Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate OpenAPI types and check for drift
        run: |
          npm run generate:types
          if ! git diff --exit-code -- apps/frontend/src/types/generated.ts; then
            echo "ERROR: apps/frontend/src/types/generated.ts is out of sync with apps/backend/openapi.yaml."
            echo "Run 'npm run generate:types' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI types in sync."

  # ─────────────────────────────────────────────────────────────────────────────
  # Build frontend — verify the frontend production bundle compiles
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend
        env:
          CI: "1"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build backend — verify the backend TypeScript compiles to dist/
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — frontend (Vitest + coverage gate) + backend (Vitest + coverage gate)
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: apps/frontend
        run: |
          npx vitest run --coverage \
            --coverage.reporter=text \
            --coverage.reporter=html \
            --coverage.reporter=json \
            --coverage.reporter=json-summary

      - name: Report frontend coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c054a2d2e2ca45446417ad5d6d5eb33092af8f1 # v2
        with:
          vite-config-path: apps/frontend/vite.config.ts
          json-summary-path: apps/frontend/coverage/coverage-summary.json
          json-final-path: apps/frontend/coverage/coverage-final.json

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with coverage
        working-directory: apps/backend
        run: |
          npx vitest run --coverage \
            --coverage.reporter=text \
            --coverage.reporter=json \
            --coverage.reporter=json-summary

      - name: Report backend coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c054a2d2e2ca45446417ad5d6d5eb33092af8f1 # v2
        with:
          name: backend
          vite-config-path: apps/backend/vitest.config.ts
          json-summary-path: apps/backend/coverage/coverage-summary.json
          json-final-path: apps/backend/coverage/coverage-final.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy — filesystem vulnerability scan (HIGH/CRITICAL).
  # Uploads SARIF to GitHub Security tab for tracking.
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # required to upload SARIF to GitHub Security
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Run Trivy vulnerability scan (table — fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Run Trivy vulnerability scan (SARIF — upload to GitHub Security)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate — all quality checks must pass here.
  # Prevents wasting time on post-quality work when basic checks are broken.
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - secrets-scan
      - deps-audit
      - lint
      - typecheck
      - typecheck-backend
      - verify-generated
      - build-frontend
      - build-backend
      - test-frontend
      - test-backend
      - trivy-scan
    if: always()
    steps:
      - name: Check all gates passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Quality gate failed. Job results: $results"
            exit 1
          fi
          echo "All quality gates passed."

  # ─────────────────────────────────────────────────────────────────────────────
  # CI Complete — aggregates all stages so branch protection has a single
  # required status check covering the full pipeline.
  # Set "CI Complete" as the required check in branch protection settings.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quality-gate]
    if: always()
    steps:
      - name: Check pipeline passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "CI pipeline failed. Job results: $results"
            exit 1
          fi
          echo "All CI stages complete."
