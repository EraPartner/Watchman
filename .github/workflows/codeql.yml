name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC — full scan even without code changes

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The app code (JS/TS) plus the CI workflows themselves (actions —
        # script injection, unpinned actions, permission misconfig). Both use
        # build-mode: none, so the single build-mode below covers each job.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: ${{ matrix.language }}
          # JS/TS is never compiled for analysis, so autobuild is dead weight —
          # skip it entirely. Query suite + path tuning live in the config file.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
