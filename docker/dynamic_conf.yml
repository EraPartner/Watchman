# Dynamic Traefik configuration.
# - Includes an example static certificate mount (useful for Cloudflare Origin CA)
# - This file is mounted read-only into the Traefik container by docker-compose

# If you want Traefik to present a static origin certificate (Cloudflare Origin CA),
# place origin cert/key into ./docker/certs/origin.pem and origin.key and Traefik
# will use them for SNI matches.

tls:
  certificates:
    - certFile: /certs/origin.pem
      keyFile: /certs/origin.key

# Optional: you can define TLS options here if needed.
#tls:
#  options:
#    default:
#      minVersion: VersionTLS12
#      sniStrict: true

# You can add more dynamic config (middlewares, routers, services) here if desired.
